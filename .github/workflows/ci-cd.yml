name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ====================== STAGE 1: BUILD ======================
  build:
    name: Build (make)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev

      - name: Build binary with make
        run: make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: v19-binary
          path: v19
          retention-days: 7

  # ====================== STAGE 2: TEST ======================
  test:
    name: Test (unit tests)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: v19-binary

      - name: Make binary executable
        run: chmod +x v19

      - name: Run unit tests
        run: bash cicd/run_tests.sh

  # ====================== STAGE 3: PACKAGE ======================
  package:
    name: Package (.deb)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev

      - name: Build .deb package
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: v19-deb-package
          path: build/v19-project.deb
          retention-days: 30
